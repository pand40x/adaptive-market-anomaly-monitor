[project]
name = "market-anomaly-monitor"
version = "0.1.0"
description = "Adaptive anomaly monitor for crypto, stocks, indexes, forex, and commodities."
requires-python = ">=3.12"
dependencies = [
  "holidays>=0.60",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.8",
  "pymongo>=4.8",
  "requests>=2.32",
  "rich>=13.7",
  "typer>=0.12",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]

[project.scripts]
market-watch = "market_anomaly.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_anomaly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
